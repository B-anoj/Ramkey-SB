<template>
<lightning-card title="RERA Number Search Bar">
<div class="slds-var-p-around_medium">
    <lightning-input label="RERA Number" value={reraNumber} onchange={handleInputChange} placeholder="Enter RERA Number Here" ></lightning-input>
    <lightning-button label="Search" onclick={handleSearch} class="slds-m-top_small"></lightning-button>
</div>

<!-- Popup Modal for Showing Details -->
<template if:true={showModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModal} title="Close">
                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 class="slds-text-heading_medium">Channel Partner Details</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <table style="width: 100%; border-collapse: collapse; border: 1px solid #000;">
                    <tr>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000; font-weight: bold;">RERA Registration Number</td>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000;">{reraNumber}</td>
                    </tr>
                    <tr>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000; font-weight: bold;">Company/Individual Name</td>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000;">{companyName}</td>
                    </tr>
                    <tr>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000; font-weight: bold;">Contact Person Name</td>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000;">{contactPersonName}</td>
                    </tr>
                    <tr>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000; font-weight: bold;">Phone Number</td>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000;">{phoneNumber}</td>
                    </tr>
                    <tr>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000; font-weight: bold;">Email</td>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000;">{email}</td>
                    </tr>
                    <tr>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000; font-weight: bold;">Office Address</td>
                    <td style="width: 50%; padding: 8px; border: 1px solid #000;">{OfficeAddress}</td>
                    </tr>
                    </table>


            </div>
            <footer class="slds-modal__footer">
                <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
                <lightning-button variant="brand" label="Get Details" onclick={saveDetails}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
</lightning-card>
</template>
