<template>
    <lightning-card class="slds-p-around_medium">
        <div class="custom-colored-div">
            <div class="center-wrapper" if:false={isNext}>
                <template lwc:if={isSpinnerRunning}>
                    <lightning-spinner alternative-text="Loading" size="x-small"></lightning-spinner>
                </template>
                <template lwc:else>
                    <h1 class="headings"><b>Select Unit</b></h1>
                    <div class="slds-p-around_medium block-field">
                        <c-lookup-field icon-name="standard:user" s-object-api-name="Opportunity" label="Opportunity"
                            onlookupupdate={lookupRecord} default-record-id={opportuniId} placeholder="type here...">
                        </c-lookup-field>
                    </div>

                    <div class="slds-p-around_medium" style="display: flex; align-items: center;">
                        <lightning-combobox label="Project Name" placeholder="Select Project" name="ProjectName"
                            options={projectNameOptions} value={BookingFormDetails.ProjectName}
                            onchange={BFonchangeHandler} required disabled="true"></lightning-combobox>
                        <lightning-button variant="brand" label="Show Drafts" onclick={handleDraftClick}
                            class="slds-m-top_medium" style="margin-left: 10px;">
                        </lightning-button>
                    </div>
                    <div class="slds-p-around_medium block-field">
                        <lightning-input label="Block" name="Block" value={BookingFormDetails.Block}
                            onchange={BFonchangeHandler} required disabled="true">
                        </lightning-input>
                    </div>

                    <div class="slds-p-around_medium" style="display: flex; align-items: center;">
                        <lightning-input type="text" name="Unit" label="Unit" value={BookingFormDetails.Unit}
                            onchange={BFonchangeHandler} required disabled="true">
                        </lightning-input>
                        <lightning-button variant="brand" label="Next" onclick={handleNextClick}
                            class="slds-m-top_medium" style="margin-left: 10px;">
                        </lightning-button>
                    </div>

                </template>
            </div>

            <template if:true={isNext}>
                <h1 style="text-align:center"> {ProjectName}</h1>

                <lightning-accordion class="example-accordion" onsectiontoggle={handleToggleSection}
                    active-section-name="A" allow-multiple-sections-open>

                    <lightning-accordion-section name="A" label="Unit Details">
                        <!-- Fields for Unit Details -->
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="Tower" name="Tower" value={BookingFormDetails.Tower}
                                    disabled="true"></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="Facing" name="facing" value={BookingFormDetails.facing}
                                    onchange={BFonchangeHandler} disabled="true"></lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="SFT Area" value={BookingFormDetails.sftArea} name="sftArea"
                                    onchange={BFonchangeHandler} disabled="true">
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="Unit Type" name="unitType" value={BookingFormDetails.unitType}
                                    onchange={BFonchangeHandler} disabled="true"></lightning-input>
                            </div>
                        </div>

                    </lightning-accordion-section>
                    <!-- Area Details Accordion -->
                    <lightning-accordion-section name="B" label="Area Details (In Square Feet)">
                        <div>
                            <!-- Table for Area Details -->
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Carpet Area</th>
                                        <th>Balcony</th>
                                        <th>Utility</th>
                                        <th>External Wall Area</th>
                                        <th>UDS</th>
                                        <th>SBUA</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>{BookingFormDetails.CarpetArea}</td>
                                        <td>{BookingFormDetails.Balcony}</td>
                                        <td>{BookingFormDetails.Utility}</td>
                                        <td>{BookingFormDetails.ExternalWallArea}</td>
                                        <td>{BookingFormDetails.UDS}</td>
                                        <td>{BookingFormDetails.SBUA}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </lightning-accordion-section>

                    <!-- Price Details Accordion -->
                    <lightning-accordion-section name="C" label="Price Details">

                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox label="Sale Type" options={saletypeOptions} name="Saletype"
                                    value={BookingFormDetails.Saletype} onchange={BFonchangeHandler} required>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="Basic Rate (per Sq.Ft)" name="BasicRate"
                                    value={BookingFormDetails.BasicRate} onchange={BFonchangeHandler} disabled="true">
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="Lump Sum Amount" value={BookingFormDetails.LumpSumAmount}
                                    name="LumpSumAmount" onchange={BFonchangeHandler} disabled="true"></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="Car Parking" value={BookingFormDetails.CarParking}
                                    name="CarParking" onchange={BFonchangeHandler} disabled="true">
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-4">
                                <lightning-input type="number" label="Extra Car Parking(No) "
                                    value={BookingFormDetails.ExtraCarParkingNo} name="ExtraCarParkingNo"
                                    onchange={BFonchangeHandler} minlength="0" maxlength="1"></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <lightning-input type="number" label="Extra Car Parking Charges"
                                    value={BookingFormDetails.ExtraCarParking} name="ExtraCarParking"
                                    onchange={BFonchangeHandler}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="EV Charges" value={BookingFormDetails.EvCharges}
                                    name="EvCharges" onchange={BFonchangeHandler} disabled="true"></lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input type="number" label="Other Charges"
                                    value={BookingFormDetails.OtherCharges} name="OtherCharges"
                                    onchange={BFonchangeHandler}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input label="Grand Total" value={BookingFormDetails.GrandTotal}
                                    name="GrandTotal" onchange={BFonchangeHandler} disabled="true"></lightning-input>
                            </div>
                        </div>
                    </lightning-accordion-section>

                    <lightning-accordion-section name="D" label="First Applicant">
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-combobox label="Customer Type" options={customerTypeOptions}
                                    value={BookingFormDetails.selectedCustomerType} required name="selectedCustomerType"
                                    onchange={BFonchangeHandler}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-combobox label="Salutation" options={salutationOptions}
                                    value={BookingFormDetails.selectedSalutation} required name="selectedSalutation"
                                    onchange={BFonchangeHandler}></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="text" required label="First Name"
                                    value={BookingFormDetails.FirstName} name="FirstName" onchange={BFonchangeHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="text" required label="Last Name"
                                    value={BookingFormDetails.LastName} name="LastName" onchange={BFonchangeHandler}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-combobox label="Gender" options={genderOptions} required
                                    value={BookingFormDetails.Gender} name="Gender" onchange={BFonchangeHandler}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="text" label="Organization" name="Organization"
                                    value={BookingFormDetails.Organization} onchange={BFonchangeHandler}>
                                </lightning-input>
                            </div>
                        </div>

                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="text" label="Designation" name="Designation"
                                    value={BookingFormDetails.Designation} onchange={BFonchangeHandler}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="text" label="Passport No" name="PassportNo"
                                    value={BookingFormDetails.PassportNo} required={isPassportRequired}
                                    onchange={BFonchangeHandler}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="Date" label="Valid till" name="Validtill"
                                    value={BookingFormDetails.Validtill} onchange={BFonchangeHandler}></lightning-input>
                            </div>
                        </div>

                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-combobox label="Profession" name="selectedProfession"
                                    options={professionOptions} value={BookingFormDetails.selectedProfession}
                                    onchange={BFonchangeHandler}></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-combobox label="S/o,W/o,D/o" name="selectedSalutationr"
                                    options={salutationrOptions} value={BookingFormDetails.selectedSalutationr}
                                    onchange={BFonchangeHandler} required></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="text" label="First Name" name="FirstNamer"
                                    value={BookingFormDetails.FirstNamer} required onchange={BFonchangeHandler}>
                                </lightning-input>
                            </div>
                        </div>

                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="text" label="Last name" name="LastNamer"
                                    value={BookingFormDetails.LastNamer} required onchange={BFonchangeHandler}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="Date" label="Date of Birth" name="DateOfBirth"
                                    value={BookingFormDetails.DateOfBirth} required onchange={BFonchangeHandler}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="Number" label="Age" name="age" value={BookingFormDetails.age}
                                    disabled="true" onchange={BFonchangeHandler}></lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="phone" label="Mobile" name="Mobile"
                                    value={BookingFormDetails.Mobile} required minlength="10"
                                    maxlength={NriMobileNumber} onchange={BFonchangeHandler}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="phone" label="Alternative Mobile" name="AlternativeMobile"
                                    value={BookingFormDetails.AlternativeMobile} onchange={BFonchangeHandler}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="text" label="Tel.Res" value={BookingFormDetails.TelRes}
                                    name="TelRes" onchange={BFonchangeHandler}></lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="text" label="Tel.Office" name="TelOffice"
                                    value={BookingFormDetails.TelOffice} onchange={BFonchangeHandler}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="Email" label="Email ID" name="Email"
                                    value={BookingFormDetails.Email} required onchange={BFonchangeHandler}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="Email" label="Alternative Email ID" name="AlternativeEmail"
                                    value={BookingFormDetails.AlternativeEmail} onchange={BFonchangeHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">

                            <div class="slds-col slds-size_1-of-3">
                                <lightning-combobox label="Marital Status" name="selectedMaritalStatus" required
                                    options={maritalStatusOptions} value={BookingFormDetails.selectedMaritalStatus}
                                    onchange={BFonchangeHandler}></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input type="Date" label="Anniversary Date"
                                    value={BookingFormDetails.AnniversaryDate} name="AnniversaryDate"
                                    onchange={BFonchangeHandler}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input label="Pan No" value={BookingFormDetails.PanNo} name="PanNo"
                                    required={isPanRequired} onchange={BFonchangeHandler} minlength="10" maxlength="10">
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                            <div class="slds-col slds-size_1-of-3">
                            <lightning-input type="checkbox" name="SignthroughDigitalSignature" label="Sign through Digital Signature"
                            checked={BookingFormDetails.SignthroughDigitalSignature} onchange={BFonchangeHandler}
                            ></lightning-input>
                        </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">
                        
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input label="Aadhar No" name="AadharNo" value={BookingFormDetails.AadharNo}
                                    onchange={BFonchangeHandler} oninput={handleInputChange} required={isAadharRequired}
                                    minlength="12" maxlength="14"></lightning-input>
                            </div>
                            </div>
                    </lightning-accordion-section>
                    <br>

                    <lightning-accordion-section name="E" label="Address">

                        <div class="same-address">

                        </div><br />




                        <div class="slds-grid slds-gutters slds-m-horizontal_medium slds-p-horizontal_medium">

                            <div class="slds-col slds-size_1-of-2">
                                <br/><br/>
                                <h1 style="text-align: right; margin-right: 50%;"><b>Present Address</b></h1>
                                <lightning-input type='text' label="Street/House No"
                                    value={BookingFormDetails.presentStreet} name="presentStreet"
                                    onchange={BFonchangeHandler}></lightning-input>
                                <lightning-input type='text' label="Street-2" value={BookingFormDetails.presentStreet2}
                                    name="presentStreet2" onchange={BFonchangeHandler}></lightning-input>
                                <lightning-input type='text' label="Street-3" value={BookingFormDetails.presentStreet3}
                                    name="presentStreet3" onchange={BFonchangeHandler}></lightning-input>
                                <lightning-input type='text' label="Street-4" value={BookingFormDetails.presentStreet4}
                                    name="presentStreet4" onchange={BFonchangeHandler}></lightning-input>
                                <lightning-input type='text' label="Street-5" value={BookingFormDetails.presentStreet5}
                                    name="presentStreet5" onchange={BFonchangeHandler}></lightning-input>
                                <lightning-input type='text' required label="City"
                                    value={BookingFormDetails.presentCity} name="presentCity"
                                    onchange={BFonchangeHandler}></lightning-input>

                                <lightning-combobox label="State" options={stateOptions}
                                    value={BookingFormDetails.selectedPresentState} name=selectedPresentState
                                    onchange={BFonchangeHandler} required>
                                </lightning-combobox>

                                <lightning-combobox label="Country" options={countryOptions} name=selectedPresentCountry
                                    value={BookingFormDetails.selectedPresentCountry} onchange={BFonchangeHandler}
                                    required></lightning-combobox>
                                <lightning-input label="Pin Code" required value={BookingFormDetails.presentPinCode}
                                    name=presentPinCode onchange={BFonchangeHandler}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input type="checkbox" label="Same as Present Address"
                                    checked={BookingFormDetails.SameasPresentAddress} onchange={handleSameAddress}>
                                </lightning-input><br/>
                                <h1 style="text-align: right; margin-right: 50%;"><b>Permanent Address</b></h1>
                                <lightning-input type='text' label="Street/House No"
                                    value={BookingFormDetails.permanentStreet} name=permanentStreet
                                    onchange={BFonchangeHandler}></lightning-input>
                                <lightning-input type='text' label="Street-2"
                                    value={BookingFormDetails.permanentStreet2} name=permanentStreet2
                                    onchange={BFonchangeHandler}></lightning-input>
                                <lightning-input type='text' label="Street-3"
                                    value={BookingFormDetails.permanentStreet3} name=permanentStreet3
                                    onchange={BFonchangeHandler}></lightning-input>
                                <lightning-input type='text' label="Street-4"
                                    value={BookingFormDetails.permanentStreet4} name=permanentStreet4
                                    onchange={BFonchangeHandler}></lightning-input>
                                <lightning-input type='text' label="Street-5"
                                    value={BookingFormDetails.permanentStreet5} name=permanentStreet5
                                    onchange={BFonchangeHandler}></lightning-input>
                                <lightning-input type='text' label="City" value={BookingFormDetails.permanentCity}
                                    name=permanentCity onchange={BFonchangeHandler}></lightning-input>
                                <lightning-combobox label="State" options={stateOptions2}
                                    value={BookingFormDetails.selectedPermanentState} name=selectedPermanentState
                                    onchange={BFonchangeHandler}></lightning-combobox>
                                <lightning-combobox label="Country" options={countryOptions2}
                                    name=selectedPermanentCountry value={BookingFormDetails.selectedPermanentCountry}
                                    onchange={BFonchangeHandler}></lightning-combobox>
                                <lightning-input label="Pin Code" value={BookingFormDetails.permanentPinCode}
                                    name=permanentPinCode onchange={BFonchangeHandler}></lightning-input>
                            </div>
                        </div>


                    </lightning-accordion-section>

                    <br><br>


                    <div class="tab">
                        <button class={otherApplicantsClass} onclick={handleTabClick} data-tab="Other Applicants">
                            <lightning-icon icon-name="standard:avatar" size="small"
                                alternative-text=" Other Applicant"></lightning-icon>Other Applicant
                        </button>
                        <button class={attachmentsClass} onclick={handleTabClick} data-tab="Attachments">
                            <lightning-icon icon-name="standard:attach" size="small"
                                alternative-text="Attachments"></lightning-icon>Attachments
                        </button>
                        <button class={schemeClass} onclick={handleTabClick} data-tab="Scheme">
                            <lightning-icon icon-name="standard:contact_list" size="small"
                                alternative-text="Scheme"></lightning-icon>Scheme
                        </button>
                        <button class={accountClass} onclick={handleTabClick} data-tab="Account">
                            <lightning-icon icon-name="standard:account" size="small"
                                alternative-text="Account"></lightning-icon>Account
                        </button>
                        <button class={otherChargesClass} onclick={handleTabClick} data-tab="Other Charges">
                            <lightning-icon icon-name="standard:expense" size="small"
                                alternative-text="Other Charges"></lightning-icon> Other Charges
                        </button>
                        <button class={sourceClass} onclick={handleTabClick} data-tab="Source">
                            <lightning-icon icon-name="standard:expense" size="small"
                                alternative-text="Source"></lightning-icon> Source
                        </button>
                        <button class={paymentScheduleClass} onclick={handleTabClick} data-tab="Payment Schedule">
                            <lightning-icon icon-name="standard:contract_payment" size="small"
                                alternative-text="Payment Schedule"></lightning-icon> Payment Schedule
                        </button>
                        <button class={otherInfoClass} onclick={handleTabClick} data-tab="Other Information">
                            <lightning-icon icon-name="standard:account_info" size="small"
                                alternative-text="Other Information"></lightning-icon>
                            Other Information
                        </button>
                        <button class={remarksClass} onclick={handleTabClick} data-tab="Remarks">
                            <lightning-icon icon-name="standard:feedback" size="small"
                                alternative-text="Remarks"></lightning-icon> Remarks
                        </button>
                    </div>
                </lightning-accordion>



                <div if:true={isOtherApplicant} class="tabcontent">

                    <!--//////////////////////////////First Add Applicant ///////////////////////////////////-->
                    <!-- <h3>Other Applicants</h3> -->
                    <div class="tab">
                        <lightning-card title="Other Applicants" class="my-card">
                            <template if:false={OtherApplicentLimitexceeded}>
                                <lightning-button variant="brand" label="+ Add Applicant" onclick={showModalBox}
                                    class="slds-m-top_medium" style="margin-left: 10px;"></lightning-button>
                            </template>
                            <br /><br /><br />

                            <template for:each={OtherApplicantDetailsJson} for:item="OtherApp">
                                <div class="slds-text-heading_small slds-card_boundary slds-m-horizontal_medium slds-m-bottom_x-small slds-p-right_large"
                                    key={OtherApp.index}>
                                    <lightning-card variant="Narrow" title="Name" icon-name="standard:account">
                                        <lightning-button-menu alternative-text="Show menu" icon-name="utility:down"
                                            variant="border-filled" slot="actions">
                                            <lightning-menu-item label="Edit" value="Edit" data-id={OtherApp.index}
                                                onclick={EditHandler}></lightning-menu-item>
                                            <lightning-menu-item label="Delete" value="Delete" data-id={OtherApp.index}
                                                data-name="name" onclick={DeleteHandler}></lightning-menu-item>
                                        </lightning-button-menu>
                                        <div class="slds-grid slds-gutters slds-p-left_medium">
                                            <div class="slds-grid slds-wrap">
                                                <div class="slds-col slds-size_3-of-12">
                                                    <span><b>Salutation </b> : {OtherApp.Salutation1}</span>
                                                </div>
                                                <div class="slds-col slds-size_3-of-12">
                                                    <span><b>First name </b> : {OtherApp.FirstName1}</span>
                                                </div>
                                                <div class="slds-col slds-size_3-of-12">
                                                    <span><b>Last name </b> : {OtherApp.LastName1}</span>
                                                </div>
                                                <div class="slds-col slds-size_3-of-12">
                                                    <span><b>Gender </b> : {OtherApp.Gender1}</span>
                                                </div>
                                                <div class="slds-col slds-size_3-of-12">
                                                    <span><b>Organization </b> : {OtherApp.Organization1}</span>
                                                </div>
                                                <div class="slds-col slds-size_3-of-12">

                                        <th class="" scope="col">Payment Schedule</th>
                                        <th class="" scope="col">%OF AGREEMENT VALUE</th>
                                        <th class="" scope="col">Amount</th>
                                        <th class="" scope="col">Action</th>
                                    </tr>
                                </thead>
                                <tbody>

                                    <template for:each={PaymentScheduleMD} for:item="rec">
                                        <tr key={rec.index}>
                                            <td>
                                                <lightning-input type="text" onchange={handlerInputChange} label=""
                                                    value={rec.Payment_Particulars} data-id={rec.index}
                                                    name="Payment_Particulars"></lightning-input>
                                            </td>
                                            <td>
                                                <lightning-input type="Number" onchange={handlerInputChange} label=""
                                                    value={rec.Amount} data-id={rec.index} name="Amount">
                                                </lightning-input>
                                            </td>
                                            <td>
                                                <lightning-input type="Number" onchange={handlerInputChange} label=""
                                                    value={rec.Amount_In_Local_Currency} data-id={rec.index}
                                                    name="Amount_In_Local_Currency" disabled="true"></lightning-input>
                                            </td>
                                            <td>
                                                <lightning-button variant="destructive" label="Delete Row"
                                                    title="Delete Row" name={rec.index} onclick={DeleteRowHandler}
                                                    class="slds-m-left_x-small"></lightning-button>

                                            </td>
                                        </tr>

                                    </template>
                                    <tr>
                                        <td>TOTAL</td>
                                        <td>{BookingFormDetails.PaymentSchedulepercentage} </td>
                                        <td>{BookingFormDetails.PaymentScheduleTotalAmount}</td>
                                        <td></td>
                                    </tr>
                                </tbody>

                            </table>
                            <p slot="footer">
                                <!-- <lightning-button variant="brand" label="Create Accounts" title="Create Account" onclick={CreateAccount} class="slds-m-left_x-small"></lightning-button> -->

                        </lightning-card>
                    </div>



                </div>

                        <lightning-combobox label="Service Category
                                        " options={serviceCategoryOptions} name="selectedServiceCategory"
                            value={BookingFormDetails.selectedServiceCategory} onchange={BFonchangeHandler} required>
                        </lightning-combobox>
                    </div>
                    <div class="two-column">
                        <lightning-combobox label="Professional Details" name="selectedProfessionDetails"
                            options={professionDetailsOptions} value={BookingFormDetails.selectedProfessionDetails}
                            onchange={BFonchangeHandler} required></lightning-combobox>
                    </div>
                    <div class="two-column">
                        <lightning-combobox label="Annual Income" options={annualIncomeOptions}
                            value={BookingFormDetails.selectedAnnualIncome} name="selectedAnnualIncome"
                            onchange={BFonchangeHandler} required></lightning-combobox>
                    </div>
                    <div class="two-column">
                        <lightning-combobox label="Mode of Payment source" options={paymentSourceOptions}
                            name="selectedPaymentSource" value={BookingFormDetails.selectedPaymentSource}
                            onchange={BFonchangeHandler} required></lightning-combobox>
                    </div>
                    <div class="two-column">
                        <lightning-combobox label="Purchase of Purpose" options={purchaseOptions}
                            value={BookingFormDetails.selectedPurchase} name="selectedPurchase"
                            onchange={BFonchangeHandler} required></lightning-combobox>
                    </div>
                    <div class="two-column">
                        <lightning-combobox label="Would you be interested in other projects by RAMKY"
                            options={otherProjectOptions} value={BookingFormDetails.selectedOtherProject}
                            name="selectedOtherProject" onchange={BFonchangeHandler} required></lightning-combobox>
                    </div>
                    <div class="two-column">
                        <lightning-dual-listbox label="Location of Interest" source-label="Available Options"
                            selected-label="Selected Options" name="selectedLocation" options={LocationOptions}
                            value={selectedLocation} onchange={BFonchangeHandler} required></lightning-dual-listbox>
                    </div>
                </div>

                <div if:true={isRemarks} class="tabcontent">
                    <h3>Remarks</h3>
                    <div class="two-column">
                        <lightning-combobox label="Select Remarks" options={remarksOptions}
                            value={BookingFormDetails.selectedRemarks} name='selectedRemarks'
                            onchange={BFonchangeHandler}></lightning-combobox>
                    </div>
                    <div class="two-column">
                        <lightning-input label="Remarks Description" value={BookingFormDetails.RemarksDescription}
                            name="RemarksDescription" onchange={BFonchangeHandler}></lightning-input>
                    </div><br />
                    <div>
                        <lightning-card title="DECLARATION" style="background-color: #c8d9eb;">
                            <lightning-input type="checkbox"
                                label="I declare that the details provoided in this form are correct & validated by me"
                                checked={BookingFormDetails.Declaration} name="Declaration"
                                onchange={BFonchangeHandler}></lightning-input>

                            <div class="center-wrapper2">
                                <lightning-input type="Text" label="Sales Person Employee ID"
                                    value={BookingFormDetails.SalesPersonEmployeeID} disabled="true"></lightning-input>
                            </div>
                        </lightning-card>
                    </div>
                </div>


            </template>




        </div>


        <template if:true={isNext}>
            <!-- Your footer content here -->
            <lightning-card>
                <p slot="footer">
                    <lightning-button variant="Neutral" class="slds-m-left_x-small" label="Save as Draft"
                        onclick={handleSaveAsDraft} disabled={isDraftSaving}></lightning-button>
                    <lightning-button variant="brand" class="slds-m-left_x-small" label="Save" onclick={handleSave}
                        disabled={isSaving}></lightning-button>
                    <template if:true={BookingFormDetails.BookingFormId}>
                        <lightning-button variant="brand-outline" class="slds-m-left_x-small" label="Preview"
                            onclick={handlePreview}></lightning-button>

                    </template>
                    <lightning-button variant="destructive" class="slds-m-left_x-small" label="Cancel"
                        onclick={handleCancel}></lightning-button>
                </p>
            </lightning-card>
            <template if:true={showModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>

                        <div class="slds-modal__content slds-p-around_medium">

                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>

                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

        </template>
