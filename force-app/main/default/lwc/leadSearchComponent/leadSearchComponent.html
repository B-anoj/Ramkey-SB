<template>
    <lightning-card title="Existing Records Search Bar">
            <div class="two-column">
                <lightning-input label="Phone Number" type="tel" value={phoneNumber} onchange={handlePhoneNumberChange}></lightning-input>
            </div>
            <div class="two-column">
                <lightning-button label="Verify" onclick={checkExistingRecords} variant="brand"></lightning-button>
            </div>
            <template if:true={showModal}>
                <div class="modal">
                    <div class="slds-modal__content slds-p-around_medium" style="max-height: 300px; overflow-y: auto;">
                        <header class="slds-modal__header">
                            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Existing Record Details</h2>
                        </header>
                        <div>
                            <p>Total Lead Count: {leadRecords.length}</p>
                            <p>Total Account Count: {accountRecords.length}</p>
                            <p>Total Contact Count: {contactRecords.length}</p>
                        </div>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr>
                                    
                                    <th scope="col">Object</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Phone</th>
                                    <th scope="col">Source</th>
                                    <th scope="col">Project</th>
                                    <th scope="col">Owner</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Lead Section -->
                                <template for:each={leadRecords} for:item="record">
                                    <tr key={record.Id}>     
                                        <td>Lead</td>
                                        <td>{record.Name}</td>
                                        <td>{record.Phone}</td>
                                        <td>{record.LeadSource}</td>
                                        <td>{record.Projects}</td>
                                        <td>{record.LeadOwner}</td>
                                    </tr>
                                </template>
                                <!-- Account Section -->                               
                                <template for:each={accountRecords} for:item="record">
                                    <tr key={record.Id}>  
                                        <td>Account</td>
                                        <td>{record.Name}</td>
                                        <td>{record.Phone}</td>
                                        <td>{record.AccountSource}</td>
                                        <td>{record.Projects}</td>
                                        <td>{record.LeadOwner}</td>
                                    </tr>
                                </template>
                                <!-- Contact Section -->                               
                                <template for:each={contactRecords} for:item="record">
                                    <tr key={record.Id}>
                                        <td>Contact</td>
                                        <td>{record.Name}</td>
                                        <td>{record.Phone}</td>
                                        <td>{record.ContactOwner}</td>
                                    </tr>
                                </template>  
                            </tbody>
                        </table>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={closeModal}>Close</button>
                    </footer>
                </div>
            </template>
        </lightning-card>
    </template>
