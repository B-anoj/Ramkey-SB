<template>
    <div class="dashboard">
        <div class="welcome-section">
            <h1>Welcome Back</h1>
            <h2>Bobby</h2>
        </div>

        <div class="main-grid">
            <div class="grid-item image-card">
                <img src={projectImage} alt="Project View" />
                <p class="caption">Ramky One Odyssey</p>
            </div>

            <div class="grid-item">
                <div class="tile">
                    <h3>Construction Status</h3>
                    <img src={chartImage} alt="Chart" class="chart-img" />
                </div>
            </div>

            <div class="grid-item tile">
                <h3>Bookings</h3>
            </div>

            <div class="grid-item tile">
                <h3>Payments</h3>
            </div>

            <div class="grid-item tile">
                <h3>Refer & Earn</h3>
            </div>

            <div class="grid-item tile">
                <h3>FAQ's</h3>
            </div>
        </div>
    </div>
</template>
