<template>
    <div class="">
        <div class="profile-container">
            <h2 class="profiledetails">Profile</h2>
            <p class="description">
                View and update your personal information, change your profile photo, and manage your account details
                including username and password. Keep your profile up-to-date to ensure smooth communication and access
                to
                all features provided by Ramky Estates. Stay current to make the most of your partnership and maximize
                your
                success.
            </p>

            <div class="profile-content">
                <div class="avatar-section">
                    <div class="avatar"> <img src={profileImage} alt="Profile" class="avatar-img" /></div>
                    <div class="username">{firstName} {lastName}</div>
                    <!-- <button class="edit-btn">Edit Profile</button> -->
                </div>

                <div class="info-section">
                    <h3>Personal Information</h3>

                    <!-- First Row: First Name + Last Name -->
                    <div class="field-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" name="FirstName" value={firstName} onchange={handleChange} readonly />
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" name="LastName" value={lastName} onchange={handleChange} readonly />
                        </div>
                    </div>

                    <!-- Second Row: Email + Phone -->
                    <div class="field-row">
                        <div class="form-group">
                            <label>Email ID</label>
                            <input type="email" value={email} readonly />
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <div class="phone-wrapper">
                                <div class="flag">
                                    <img src={flagImage} alt="India Flag" class="flag-img" />
                                    <span class="country-code">91</span>
                                </div>
                                <input type="text" value={phone} readonly />
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</template>
